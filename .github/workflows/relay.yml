# Relay reads the results of this workflow. Keep the artifact names
# relay-unit and relay-e2e, as Relay looks for them by name.
name: Relay checks

on:
  push:
    branches: [main, develop, "relay/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p reports
      - name: Lint
        run: npx eslint . --format json --output-file reports/eslint.json
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-unit
          path: reports/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-e2e
          path: reports/
          if-no-files-found: warn
